<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Graphic Era Lost &amp; Found</title>
    <link rel="stylesheet" href="1.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <h2>Graphic Era</h2>
            <span>Lost &amp; Found Portal</span>
        </div>
        <nav class="nav-links" aria-label="Main">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="registration.html" aria-current="page">Register</a>
            <a href="add_item.html">Add Item</a>
            <a href="profile.html">My Profile</a>
        </nav>
    </header>
    <main>
        <h1>Create a student account</h1>
        <form class="panel" id="regForm">
            <label for="fullname">Full name</label>
            <input id="fullname" name="fullname" maxlength="100" required>
            <label for="rollno">University roll number</label>
            <input id="rollno" name="rollno" maxlength="30" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" pattern="[0-9+\- ]{10,15}" title="10 to 15 digits" required>
            <label for="course">Course / branch</label>
            <input id="course" name="course" list="courses" placeholder="e.g. B.Tech CSE" maxlength="60" required>
            <datalist id="courses">
                <option value="B.Tech CSE"><option value="B.Tech ECE"><option value="B.Tech ME">
                <option value="B.Tech CE"><option value="BCA"><option value="MCA">
                <option value="M.Tech"><option value="BBA"><option value="MBA"><option value="B.Sc">
            </datalist>
            <label for="year">Year of study</label>
            <select id="year" name="year" required>
                <option value="1">1st year</option><option value="2">2nd year</option>
                <option value="3">3rd year</option><option value="4">4th year</option>
                <option value="5">5th year</option>
            </select>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="6" required>
            <label for="confirm">Confirm password</label>
            <input id="confirm" name="confirm" type="password" required>
            <button type="submit">Register</button>
            <p class="msg" id="msg" role="status"></p>
            <p>Already registered? <a href="login.html">Log in</a></p>
        </form>
    </main>
    <footer>Graphic Era (Deemed to be University), Dehradun &middot; Campus Lost &amp; Found</footer>
    <script src="script.js"></script>
</body>
</html>
